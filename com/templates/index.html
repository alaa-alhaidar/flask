<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>

    <title>Speech to Text Translation</title>
</head>
<body>
    <div class="container-fluid bkg full-height app-shell" style="background-image: url('{{ url_for('static', filename='img/img2.jpg') }}');">
        <div class="app-inner">
            <h1 class="page-title">Speech to Text Translation</h1>

            <div class="controls-panel">
                <form method="POST" action="/" class="language-form">
                    <div class="mb-3 language-block">
                        <label for="language-select" class="form-label">Language:</label>
                        <select id="language-select" name="language" class="form-select language-select">
                            <option value="en_to_de">English to German</option>
                            <option value="de_to_en">German to English</option>
                        </select>
                    </div>
                </form>

                <div class="recording-row">
                    <div class="recording-col">
                        <button class="btn btn-lg btn-primary w-100 action-btn" type="button" id="start-btn" style="border-radius: 18px 0 0 18px;">
                            <h2>Record</h2>
                            <span class="material-symbols-outlined">record_voice_over</span>
                        </button>
                    </div>
                    <div class="recording-col">
                        <button class="btn btn-lg btn-primary w-100 action-btn" type="button" id="stop-btn" disabled>
                            <h2>Stop</h2>
                            <span class="material-symbols-outlined">stop_circle</span>
                        </button>
                    </div>
                    <div class="recording-col">
                        <button class="btn btn-lg btn-primary w-100 action-btn" type="button" id="save-btn" style="border-radius: 0 18px 18px 0;" disabled>
                            <h2>Save</h2>
                            <span class="material-symbols-outlined">file_save</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="results-grid">
                <div class="result-column">
                    <h2>Transcript:</h2>
                    <form method="POST">
                        <textarea id="result" name="text" class="form-control output-box transcript-box" rows="10" cols="50">{{ input_text }}</textarea>
                    </form>
                </div>

                <div class="result-column">
                    <h2>Translation:</h2>
                    <div class="form-control output-box translation-box" id="translation-result">{{ translated_text }}</div>
                </div>
            </div>

            <div class="translate-wrap">
                <button class="translate-btn btn btn-success btn-lg" id="translate-btn" type="submit">Translate</button>
            </div>
        </div>
    </div>
</body>
</html>
